<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>폴래 · 투표 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #F2EDE7; font-family: "Pretendard", -apple-system, system-ui, sans-serif; min-height: 100vh; }
  body {
    display:flex; align-items:center; justify-content:center;
    padding: 40px 20px;
    background:
      radial-gradient(ellipse at top, #FFE9DD 0%, transparent 60%),
      radial-gradient(ellipse at bottom right, #FCE4DA 0%, transparent 50%),
      #F7EFE8;
  }
  .stage {
    transform-origin: top center;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="root"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="pollae-tokens.jsx"></script>
<script type="text/babel" src="pollae-vote-buttons.jsx"></script>
<script type="text/babel" src="pollae-vote.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { IOSDevice, TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakToggle, TweakSelect, PollaeVotePage } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mode": "public",
  "btnStyle": "emoji",
  "showHostBubble": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Scale the device to fit smaller viewports
  React.useEffect(() => {
    const stage = document.getElementById('stage');
    const fit = () => {
      const vh = window.innerHeight - 80;
      const vw = window.innerWidth - 40;
      const scale = Math.min(1, vh / 874, vw / 402);
      stage.style.transform = `scale(${scale})`;
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  return (
    <>
      <IOSDevice width={402} height={874}>
        <PollaeVotePage tweaks={t}/>
      </IOSDevice>
      <TweaksPanel title="폴래 Tweaks">
        <TweakSection label="투표 모드"/>
        <TweakRadio
          label="투표자 공개"
          value={t.mode}
          options={[
            {value:'public',  label:'공개'},
            {value:'private', label:'비공개'},
          ]}
          onChange={(v) => setTweak('mode', v)}
        />
        <TweakSection label="버튼 스타일"/>
        <TweakRadio
          label="○△× 표현"
          value={t.btnStyle}
          options={[
            {value:'emoji',  label:'이모지'},
            {value:'symbol', label:'심볼'},
            {value:'text',   label:'텍스트'},
          ]}
          onChange={(v) => setTweak('btnStyle', v)}
        />
      </TweaksPanel>
    </>
  );
}

const waitForDeps = () => {
  if (window.IOSDevice && window.PollaeVotePage && window.TweaksPanel && window.useTweaks) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  } else {
    setTimeout(waitForDeps, 50);
  }
};
waitForDeps();
</script>
</body>
</html>
